name: Build Windows executable

# Mirrors build.bat on a Windows runner so the .exe can be produced without a
# local Windows machine. The artifact is attached to the run; releases are cut
# manually from it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "main.py"
      - "app.spec"
      - "pyi_rth_backend.py"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mjs"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Test React frontend
        run: npm run test:run

      - name: Build React frontend
        run: npm run build

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run backend regression tests
        run: python -m unittest discover -s tests

      - name: Build executable
        run: pyinstaller app.spec

      - name: Smoke-check the executable
        shell: pwsh
        run: |
          $exe = "dist\be-net.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced" }
          $size = (Get-Item $exe).Length
          Write-Host "exe size: $size bytes"
          if ($size -lt 20MB) { throw "exe suspiciously small" }
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5001/ -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match "<div id=""root""") { $ok = $true; break }
            } catch {}
          }
          $err = $null
          if ($ok) {
            # End-to-end: create DB -> create folder -> upload CSV -> read the org chart back,
            # using the same requests the React upload dialog sends (folder_id, not folder_name).
            try {
              $base = "http://127.0.0.1:5001"
              $work = Join-Path $env:RUNNER_TEMP "be-net-smoke"
              New-Item -ItemType Directory -Force -Path $work | Out-Null
              $csv = Join-Path $work "org.csv"
              @(
                "person_id,name,role,hierarchical_structure,department,birth_date,rank,organization_id,organization_name",
                "1,Dana Levi,CEO,/CEO,Management,1975-03-02,10,ORG1,be-net",
                "2,Yossi Cohen,CTO,/CEO/CTO,Tech,1980-07-14,9,ORG1,be-net",
                "3,Omer Bar,Dev Lead,/CEO/CTO/Dev Lead,Tech,1990-01-20,7,ORG1,be-net"
              ) | Set-Content -Path $csv -Encoding utf8
              $db = Invoke-RestMethod -Method Post -Uri "$base/create_new_db" -ContentType "application/json" `
                -Body (@{ db_path = $work; db_name = "orgchart.db" } | ConvertTo-Json)
              $dbPath = $db.db_path
              Write-Host "created db: $dbPath"
              $folder = Invoke-RestMethod -Method Post -Uri "$base/folder?db_path=$([uri]::EscapeDataString($dbPath))" `
                -ContentType "application/json" -Body (@{ name = "test" } | ConvertTo-Json)
              Write-Host "created folder id: $($folder.folder_id)"
              $up = Invoke-RestMethod -Method Post -Uri "$base/upload" -Form @{
                file = Get-Item $csv
                folder_id = "$($folder.folder_id)"
                is_new_folder = "false"
                table_name = "smoke"
                upload_date = "2026-01-01"
                db_path = $dbPath
              }
              Write-Host "upload -> table_id $($up.table_id) folder_id $($up.folder_id)"
              if (-not $up.table_id) { throw "upload response has no table_id: $($up | ConvertTo-Json -Compress)" }
              $org = Invoke-RestMethod -Method Get -Uri "$base/org_data?table_id=$($up.table_id)"
              $json = $org | ConvertTo-Json -Depth 20 -Compress
              if ($json -notmatch "Dana Levi" -or $json -notmatch "Omer Bar") { throw "org_data missing uploaded people: $json" }
              Write-Host "org_data returned the uploaded chart"
            } catch { $err = $_ }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name be-net -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "exe started but never served the app on :5001" }
          if ($err) { throw "end-to-end upload through the exe failed: $err" }
          Write-Host "exe served the app on :5001 and completed an upload end-to-end"

      - uses: actions/upload-artifact@v4
        with:
          name: be-net-windows
          path: dist/be-net.exe
          if-no-files-found: error
